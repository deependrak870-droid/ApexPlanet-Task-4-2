
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ShopEasy - Product Listing</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">🛍️ ShopEasy</div>
    <div class="nav-text">Explore Amazing Products</div>
  </header>

  <section class="hero">
    <h1>Discover Our Products</h1>
    <p>Find your favorite products at great prices.</p>
  </section>

  <main class="main-container">

    <!-- Sidebar Filters -->
    <aside class="sidebar">

      <h2>Filters</h2>

      <div class="filter-group">
        <label for="categoryFilter">Category</label>

        <select id="categoryFilter">
          <option value="All">All Categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Fashion">Fashion</option>
          <option value="Books">Books</option>
          <option value="Home">Home</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="priceRange">Maximum Price</label>

        <input type="range"
               id="priceRange"
               min="0"
               max="5000"
               step="100"
               value="5000">

        <p>Up to ₹<span id="priceValue">5000</span></p>
      </div>

      <button id="resetFilters" class="reset-btn">
        Reset Filters
      </button>

    </aside>

    <!-- Products Area -->
    <section class="products-section">

      <div class="toolbar">

        <input
          type="search"
          id="searchInput"
          placeholder="Search products..."
          aria-label="Search products"
        >

        <select id="sortSelect"
                aria-label="Sort products">
          <option value="default">Default Sorting</option>
          <option value="priceLow">Price: Low to High</option>
          <option value="priceHigh">Price: High to Low</option>
          <option value="ratingHigh">Rating: High to Low</option>
          <option value="nameAZ">Name: A to Z</option>
        </select>

      </div>

      <p id="resultCount" class="result-count"></p>

      <div id="productContainer" class="product-grid">
      </div>

      <p id="noProducts" class="no-products" hidden>
        No products found. Try different filters.
      </p>

    </section>

  </main>

  <footer>
    <p>© 2026 ShopEasy | Task 4 Web Development Project</p>
  </footer>

  <script src="products.js"></script>
  <script src="script.js"></script>

</body>
</html>
